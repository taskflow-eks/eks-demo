name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: taskflow-frontend
  EKS_CLUSTER: taskflow-cluster
  K8S_NAMESPACE: taskflow
  DEPLOYMENT: taskflow-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # 빌드가 깨지는 코드가 클러스터로 나가지 않도록 먼저 검증
      - name: Build check
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/taskflow-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Update image
        run: |
          kubectl set image deployment/$DEPLOYMENT \
            $DEPLOYMENT=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -n $K8S_NAMESPACE

      # set image는 요청만 보내므로, 파드가 Ready가 될 때까지 기다린다
      - name: Verify rollout
        run: kubectl rollout status deployment/$DEPLOYMENT -n $K8S_NAMESPACE --timeout=180s

      - name: Show pod status on failure
        if: failure()
        run: |
          kubectl get pods -n $K8S_NAMESPACE -o wide
          kubectl describe pods -n $K8S_NAMESPACE -l app=$DEPLOYMENT
          kubectl logs -n $K8S_NAMESPACE --all-containers --tail=100 -l app=$DEPLOYMENT || true

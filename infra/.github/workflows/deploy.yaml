name: Terraform Check

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 인프라 코드가 깨지지 않았는지 검사한다 (AWS 접속 없음)
  # apply는 리소스 생성 비용이 발생하므로 로컬에서 수동으로 실행한다
  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format check
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Init
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Validate
        working-directory: ./terraform
        run: terraform validate

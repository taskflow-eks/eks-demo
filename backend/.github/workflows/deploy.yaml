name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: taskflow-backend
  EKS_CLUSTER: taskflow-cluster
  K8S_NAMESPACE: taskflow
  DEPLOYMENT: taskflow-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # app.py는 임포트 시점에 DB에 접속하므로 문법 검사만 수행
      - name: Syntax check
        run: python -m py_compile app.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/taskflow-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Update image
        run: |
          kubectl set image deployment/$DEPLOYMENT \
            $DEPLOYMENT=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -n $K8S_NAMESPACE

      - name: Verify rollout
        run: kubectl rollout status deployment/$DEPLOYMENT -n $K8S_NAMESPACE --timeout=180s

      - name: Show pod status on failure
        if: failure()
        run: |
          kubectl get pods -n $K8S_NAMESPACE -o wide
          kubectl describe pods -n $K8S_NAMESPACE -l app=$DEPLOYMENT
          kubectl logs -n $K8S_NAMESPACE --all-containers --tail=100 -l app=$DEPLOYMENT || true

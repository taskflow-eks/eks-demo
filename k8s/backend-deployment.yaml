apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  namespace: taskflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow-backend
  template:
    metadata:
      labels:
        app: taskflow-backend
    spec:
      serviceAccountName: backend-sa
      # 두 AZ에 고르게 나누어 배치 (한쪽 AZ 장애 시에도 남은 파드가 요청 처리)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: taskflow-backend
      containers:
        - name: taskflow-backend
          image: 515682373899.dkr.ecr.ap-northeast-2.amazonaws.com/taskflow-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_SECRET_NAME
              value: "taskflow-db"
            - name: AWS_REGION
              value: "ap-northeast-2"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

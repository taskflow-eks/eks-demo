apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-backend
  namespace: demo-eks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-backend
  template:
    metadata:
      labels:
        app: demo-backend
    spec:
      containers:
        - name: demo-backend
          image: <account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/demo-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_SECRET_NAME
              value: "eks-demo"
            - name: AWS_REGION
              value: "ap-northeast-2"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
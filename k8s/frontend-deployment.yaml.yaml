apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-frontend
  namespace: eks-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-frontend
  template:
    metadata:
      labels:
        app: demo-frontend
    spec:
      containers:
        - name: demo-frontend
          image: <account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/demo-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
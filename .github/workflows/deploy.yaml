name: Deploy EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write      # OIDC 토큰 발급용
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  EKS_CLUSTER: eks-demo-cluster
  K8S_NAMESPACE: demo-eks

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-eks
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.ECR_REGISTRY }}/demo-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.ECR_REGISTRY }}/demo-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Deploy to EKS
        run: |
          sed -i "s|:latest|:${{ github.sha }}|g" k8s/*.yaml
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/frontend -n $K8S_NAMESPACE --timeout=180s
          kubectl rollout status deployment/backend  -n $K8S_NAMESPACE --timeout=180s

      - name: Show pod status on failure
        if: failure()
        run: |
          kubectl get pods -n $K8S_NAMESPACE
          kubectl describe pods -n $K8S_NAMESPACE
          kubectl logs -n $K8S_NAMESPACE --all-containers --tail=100 -l app=backend || true
          kubectl logs -n $K8S_NAMESPACE --all-containers --tail=100 -l app=frontend || true
